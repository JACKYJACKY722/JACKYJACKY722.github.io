<!DOCTYPE html>
<html>
<head>
<style>
	 body{
            background-color: white;
            color: black;
        }

        .dark{
            background-color: black;
            color: white;
        }
</style>
</head>
<body>
#1
<label>Enter password</label>
<input type="text" id='psw'>
<button onclick="check_password()">Check</button><br>
<h3 id="heading1"></h3>

#2
<label>Age</label>
<input type="text" id='Age'><br>

<label>Employee ID</label>
<input type="text" id='ID'><br>

<label>Years of experience</label>
<input type="text" id='YoE'><br>

<button onclick="Clearance()">Check Clearance</button>
<h3 id='heading2'></h3>

#3
<h3>Registration</h3>
<label>Name:</label>
<input type='text' id='name'><br>

<label>Password:</label>
<input type=text id='password'>
<button onclick='getpsw()'>register</button>
<button onclick='signin()'>signin</button><br><br>
#4<br>
<button onclick="DarkMode()">Dark_Mode</button><br><br>

#5<br>
<label>Website URL:</label>
<input type="text" id="URL">
<button onclick="Analyze_Website()">Analyze Website</button>
<h3 id="heading3"></h3>

<script>

	function check_password(){
	 let user_entered = document.getElementById('psw').value;
	 let database1 = []
	 if(user_entered.length < 12){
	 	database1.push('At least 12 characters<br>')
	 }
	 if(!/[A-Z]/.test(user_entered)){
	 	database1.push('Contains uppercase letter<br>')
	 }
	 if(!/[a-z]/.test(user_entered)){
	 	database1.push('Contains lowercase letter<br>')
	 }
	 if(!/[!@#$%^&*()_+[;''""<>/?]/.test(user_entered)){
	 	database1.push('Missing punctuation')
	 }
	 if(!/[ ]/.test(user_entered)){
	 	database1.push('Should not contain any spaces<br>')
	 }
	 else{
	 	database1.push('Strong Password<br>')
	 }
	 document.getElementById('heading1').innerHTML = database1;
	}


	function Clearance(){
		let Age = parseInt(document.getElementById('Age').value);
		let ID = document.getElementById('ID').value;
		let YoE = parseInt(document.getElementById('YoE').value);
		let database2 = [];
		if(Age >= 18 && ID.startsWith('EMP') && YoE >= 1){
			database2.push('Level 1')
		}
		else if(Age >= 21 && ID.startsWith('EMP') && YoE >= 2){
			database2.push('Level 2')
		}
		else if(Age >= 25 && ID.startsWith('SEC') && YoE >= 5){
			database2.push('Level 3')
		}
		else if(Age < 18){
			database2.push('Access Denied')
		}
		else if(Age >=18 && !ID.startsWith('SEC') && !ID.startsWith('EMP')){
			database2.push('invalid employee ID')
		}
		document.getElementById('heading2').innerHTML = database2;
	}

	let database = [];
    function getpsw(){
        let user_entered = document.getElementById('name').value;
        let psw_entered = document.getElementById('password').value;
        let pair = (user_entered+ ' '+psw_entered).split(' ');
          database.push(pair)
          alert('registration ok!')
        }
    function signin(){
        let user_entered = document.getElementById('name').value;
        let psw_entered = document.getElementById('password').value;
        for(let i = 0; i < database.length;i++){
            if(database[i][0] == user_entered && database[i][1] == psw_entered)
                {
                    alert('login successfully!');
                    return;
                }
                else{
                    alert('login info incorrect!');
                    return;
                }
            }
        }
    function DarkMode(){
    	document.body.classList.toggle("dark");
    }
    function Analyze_Website(){
    	let user_entered1 = document.getElementById('URL').value;
    	if (!user_entered1.startsWith('https://')){
    		document.getElementById('heading3').innerHTML = 'Does NOT start with https://';
    	}
    	else{
    		document.getElementById('heading3').innerHTML ="nothing happened";
    	}
    	if(user_entered1.includes("free-money","hack","winner","bitcoin")){
    		document.getElementById('heading3').innerHTML ='contains suspicious keywords';
    	}
    }
</script>
</body>
</html>
